<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Workspace</title>
<meta name="theme-color" content="#FAF7F0">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%237A6240'/%3E%3Ctext%20x='32'%20y='45'%20font-family='Georgia,serif'%20font-size='38'%20font-weight='500'%20fill='%23FAF7F0'%20text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAF7F0;
    --ink: #1A1810;
    --muted: #6A6455;
    --accent: #7A6240;
    --paper: #FFFDF6;
    --hairline: rgba(60, 50, 30, 0.18);
    --hairline-strong: rgba(60, 50, 30, 0.35);
    --header-h: 52px;
    --tabs-h: 46px;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== ヘッダー ===== */
  header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--bg);
    flex-shrink: 0;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .brand span { color: var(--accent); }
  .auth {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .auth .email { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .auth button {
    font-family: inherit;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--hairline-strong);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }
  .auth button.login {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 500;
  }
  .auth button:hover { opacity: 0.85; }

  /* ===== タブ ===== */
  nav {
    height: var(--tabs-h);
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 0 12px;
    border-bottom: 1px solid var(--hairline);
    background: var(--bg);
    flex-shrink: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--muted);
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 10px 16px 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab.on {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab .due {
    display: inline-block;
    min-width: 17px;
    padding: 0 4px;
    margin-left: 6px;
    border-radius: 999px;
    background: #A8432F;
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 17px;
    text-align: center;
    vertical-align: 1px;
  }
  .tabspacer { flex: 1; }
  .tools {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-bottom: 6px;
  }
  .tools button {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    padding: 6px;
    border-radius: 6px;
    line-height: 0;
  }
  .tools button:hover { color: var(--accent); background: rgba(122, 98, 64, 0.08); }
  .tools svg { width: 16px; height: 16px; }

  /* ===== モジュール表示エリア ===== */
  main { flex: 1; position: relative; background: var(--paper); }
  main iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: var(--paper);
  }
  main iframe.on { display: block; }

  #loginNote {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 24px;
    background: var(--bg);
    z-index: 5;
  }
  #loginNote.show { display: flex; }
  #loginNote h2 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; }
  #loginNote p { font-size: 13.5px; color: var(--muted); line-height: 1.9; }
  #loginNote button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <div class="brand">My <span>Workspace</span></div>
  <div class="auth" id="authArea">
    <button class="login" id="loginBtn" style="display:none;">Googleでログイン</button>
    <span class="email" id="userEmail" style="display:none;"></span>
    <button id="logoutBtn" style="display:none;">ログアウト</button>
  </div>
</header>

<nav id="tabs"></nav>

<main id="stage">
  <div id="loginNote">
    <h2>My Workspace</h2>
    <p>ここで一度ログインすると、すべてのモジュールに<br>まとめてサインインされます。</p>
    <button onclick="signIn()">Googleでログイン</button>
  </div>
</main>

<script>
  /* =========================================================
     モジュール登録リスト
     新しいツールを追加するときは、ここに1行足すだけでOK。
       id    : 半角英数のユニークな名前
       label : タブに表示する名前
       url   : ツールのURL(同じ github.io 上に置くとログインが共有されます)
     ========================================================= */
  const MODULES = [
    { id: 'tasks',   label: 'My Tasks',           url: 'https://chikakomoriyama-commits.github.io/my-tasks/' },
    { id: 'draft',   label: '申込み返信ドラフト',   url: 'https://chikakomoriyama-commits.github.io/draft-tool/' },
    { id: 'journey', label: '顧客ジャーニー台帳',   url: 'https://chikakomoriyama-commits.github.io/rfc-journey/journey-tool.html' },
    { id: 'creating', label: 'Creating Board',      url: 'https://chikakomoriyama-commits.github.io/creating-board/' },
    { id: 'routines', label: '定期リマインダー',     url: 'https://chikakomoriyama-commits.github.io/routines/' },
    /* 例: { id: 'newtool', label: '新しいツール', url: 'https://chikakomoriyama-commits.github.io/new-tool/' }, */
  ];

  /* ===== Supabase(ログイン状態の管理) ===== */
  const SUPABASE_URL = 'https://kzzdsibwjvocbihfqtlv.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_n2qWIOJzVfrzjYANDe4UzA_O4dLVmZ1';
  const sb = window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      })
    : null;

  const tabsEl = document.getElementById('tabs');
  const stage = document.getElementById('stage');
  const loginNote = document.getElementById('loginNote');
  let active = null;
  let signedIn = false;
  const LAST_TAB_KEY = 'workspace-last-tab';

  /* ===== タブの生成 ===== */
  MODULES.forEach(m => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.id = 'tab-' + m.id;
    b.textContent = m.label;
    b.onclick = () => show(m.id);
    tabsEl.appendChild(b);
  });
  const spacer = document.createElement('div');
  spacer.className = 'tabspacer';
  tabsEl.appendChild(spacer);

  const tools = document.createElement('div');
  tools.className = 'tools';
  tools.innerHTML =
    '<button title="このモジュールを再読み込み" aria-label="再読み込み" onclick="reloadActive()">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>' +
    '</button>' +
    '<button title="このモジュールを新しいタブで開く" aria-label="新しいタブで開く" onclick="openActive()">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
    '</button>';
  tabsEl.appendChild(tools);

  /* ===== モジュールの表示(初回表示時にiframeを生成=遅延読み込み) ===== */
  function show(id) {
    const m = MODULES.find(x => x.id === id);
    if (!m) return;
    active = id;
    try { localStorage.setItem(LAST_TAB_KEY, id); } catch (e) {}
    MODULES.forEach(x => {
      const t = document.getElementById('tab-' + x.id);
      if (t) t.classList.toggle('on', x.id === id);
    });
    let f = document.getElementById('frame-' + id);
    if (!f && signedIn) {
      f = document.createElement('iframe');
      f.id = 'frame-' + id;
      f.src = m.url;
      f.title = m.label;
      stage.appendChild(f);
    }
    stage.querySelectorAll('iframe').forEach(x => x.classList.toggle('on', x.id === 'frame-' + id));
    updateDueBadge();
  }

  /* ===== 定期リマインダーの期限バッジ(タブに赤丸で件数表示) ===== */
  async function updateDueBadge() {
    if (!sb || !signedIn) return;
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return;
      const d = new Date();
      const today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const { count, error } = await sb.from('routines')
        .select('id', { count: 'exact', head: true })
        .eq('user_id', session.user.id)
        .lte('next_due', today);
      if (error) return;
      const tab = document.getElementById('tab-routines');
      if (!tab) return;
      let b = tab.querySelector('.due');
      if (count > 0) {
        if (!b) { b = document.createElement('span'); b.className = 'due'; tab.appendChild(b); }
        b.textContent = count;
      } else if (b) {
        b.remove();
      }
    } catch (e) {}
  }
  setInterval(updateDueBadge, 30 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) updateDueBadge(); });

  function reloadActive() {
    const f = document.getElementById('frame-' + active);
    if (f) f.src = f.src;
  }
  function openActive() {
    const m = MODULES.find(x => x.id === active);
    if (m) window.open(m.url, '_blank');
  }

  /* ===== ログイン処理(ここで1回ログインすれば全モジュール共通) ===== */
  async function signIn() {
    if (!sb) { alert('接続の初期化に失敗しました。再読み込みしてください。'); return; }
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.href.split('#')[0].split('?')[0] }
    });
    if (error) alert('ログインに失敗しました: ' + error.message);
  }
  async function signOut() {
    if (!sb) return;
    await sb.auth.signOut();
    location.reload();
  }
  document.getElementById('loginBtn').onclick = signIn;
  document.getElementById('logoutBtn').onclick = signOut;

  function setAuthUI(session) {
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const emailEl = document.getElementById('userEmail');
    if (session) {
      loginBtn.style.display = 'none';
      logoutBtn.style.display = '';
      emailEl.style.display = '';
      emailEl.textContent = session.user.email || '';
      loginNote.classList.remove('show');
    } else {
      loginBtn.style.display = '';
      logoutBtn.style.display = 'none';
      emailEl.style.display = 'none';
      loginNote.classList.add('show');
    }
  }

  function boot(session) {
    const wasSignedIn = signedIn;
    signedIn = !!session;
    setAuthUI(session);
    if (signedIn && !wasSignedIn) {
      let last = null;
      try { last = localStorage.getItem(LAST_TAB_KEY); } catch (e) {}
      show(MODULES.some(m => m.id === last) ? last : MODULES[0].id);
    }
  }

  if (sb) {
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') boot(null);
      else if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') boot(session);
    });
  } else {
    loginNote.classList.add('show');
  }
</script>
</body>
</html>
